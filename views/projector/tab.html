<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>📖 Bible ①</title>
    <link rel="stylesheet" href="../common/action-btn.css" />
    <link rel="stylesheet" href="../common/clock-container.css" />
    <link rel="stylesheet" href="../common/dock-bar.css" />
    <link rel="stylesheet" href="tab.css" />
    <script src="../icons/icons.js"></script>
    <script src="../common/utilities.js"></script>
    <script src="../common/dock-bar.js"></script>
    <script src="external/dompurify.min.js"></script>
    <script src="external/marked.min.js"></script>
  </head>
  <body class="page-background-image">
    <div id="root" class="clock-container"></div>
    <div class="actions">
      <button type="button" data-key="F11" class="action-btn auto-hide" title="Enter/Exit Fullscreen">F11</button>
      <button type="button" data-key="ArrowUp" class="action-btn" title="Previous verse (Up)">◀</button>
      <button type="button" data-key="ArrowDown" class="action-btn" title="Next verse (Down)">▶</button>
    </div>
    <script src="tab.js" type="module"></script>
  </body>
</html>
